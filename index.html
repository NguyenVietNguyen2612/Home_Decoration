<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Room Decoration - Home</title>
    <link rel="stylesheet" href="css/home.css">
</head>
<body>
    <!-- Animated background elements -->
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>

    <div class="home-container">
        <h1>Room Decoration</h1>
        <p>Design your dream space in stunning 3D. Create, explore, and visualize your ideas with ease.</p>
        
        <div class="menu-grid">
            <button class="menu-btn primary" onclick="window.location.href='editor.html'">
                <span class="btn-icon">✨</span>
                <span>New Project</span>
            </button>
            <button class="menu-btn" onclick="window.location.href='upload.html'">
                <span class="btn-icon">📁</span>
                <span>Saved Projects</span>
            </button>
            <button class="menu-btn" onclick="window.location.href='tutorial.html'">
                <span class="btn-icon">🎓</span>
                <span>Tutorial</span>
            </button>
            <button class="menu-btn" onclick="toggleTheme()" id="btn-theme-toggle">
                <span class="btn-icon" id="theme-icon">🌙</span>
                <span id="theme-text">Switch to Light Mode</span>
            </button>
        </div>
    </div>

    <script src="js/settings.js"></script>
    <script src="js/audio.js"></script>
</body>
</html>
