<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Room Decoration - Home</title>
    <link rel="stylesheet" href="css/home.css">
</head>
<body>
    <!-- Animated background elements -->
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>

    <div class="home-container">
        <h1>Room Decoration</h1>
        <p>Design your dream space in stunning 3D. Create, explore, and visualize your ideas with ease.</p>
        
        <div class="menu-grid">
            <button class="menu-btn primary" onclick="window.location.href='editor.html'">
                <span class="btn-icon">✨</span>
                Dự án mới
            </button>
            <button class="menu-btn" onclick="openSavedProjects()">
                <span class="btn-icon">📁</span>
                Dự án sẵn có
            </button>
            <button class="menu-btn" onclick="alert('Tính năng Cài đặt đang được phát triển.')">
                <span class="btn-icon">⚙️</span>
                Cài đặt
            </button>
            <button class="menu-btn" onclick="alert('Tính năng Ngôn ngữ đang được phát triển.')">
                <span class="btn-icon">🌐</span>
                Ngôn ngữ
            </button>
        </div>
    </div>

    <!-- Saved Projects Modal -->
    <div class="modal-overlay" id="projects-modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Bản thiết kế đã lưu</h2>
                <button class="close-btn" onclick="closeSavedProjects()">✕</button>
            </div>
            <div class="project-list" id="project-list-container">
                <!-- Danh sách sẽ được tải qua JS -->
            </div>
        </div>
    </div>

    <script>
        function openSavedProjects() {
            const modal = document.getElementById('projects-modal');
            const container = document.getElementById('project-list-container');
            
            // Clear current list
            container.innerHTML = '';
            
            try {
                const saved = localStorage.getItem('home_decoration_designs');
                if (saved) {
                    const designs = JSON.parse(saved);
                    if (designs.length > 0) {
                        // Reverse to show newest first
                        designs.reverse().forEach(design => {
                            const date = new Date(design.date).toLocaleDateString('vi-VN', {
                                year: 'numeric', month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit'
                            });
                            
                            const item = document.createElement('div');
                            item.className = 'project-item';
                            item.innerHTML = `
                                <div class="project-info">
                                    <h3>${design.name}</h3>
                                    <p>${date} • ${design.furnitures.length} objects</p>
                                </div>
                                <span style="color: #6366f1; font-size: 1.2rem;">➔</span>
                            `;
                            // Khi click vào project, mở editor (Trong tương lai có thể truyền id qua URL: editor.html?id=...)
                            item.onclick = () => {
                                // Tạm thời cứ chuyển hướng sang editor, tính năng load cụ thể sẽ được code sau
                                window.location.href = 'editor.html';
                            };
                            container.appendChild(item);
                        });
                    } else {
                        container.innerHTML = '<p class="no-projects">Bạn chưa lưu bản thiết kế nào.</p>';
                    }
                } else {
                    container.innerHTML = '<p class="no-projects">Bạn chưa lưu bản thiết kế nào.</p>';
                }
            } catch (e) {
                container.innerHTML = '<p class="no-projects">Lỗi khi tải dữ liệu.</p>';
            }
            
            modal.classList.add('active');
        }

        function closeSavedProjects() {
            document.getElementById('projects-modal').classList.remove('active');
        }

        // Đóng modal khi bấm ra ngoài
        document.getElementById('projects-modal').addEventListener('click', (e) => {
            if (e.target === document.getElementById('projects-modal')) {
                closeSavedProjects();
            }
        });
    </script>
</body>
</html>
