<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Room Decoration - Home</title>
    <link rel="stylesheet" href="css/home.css">
</head>
<body>
    <!-- Animated background elements -->
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>

    <div class="home-container">
        <h1 data-i18n="home_title">Room Decoration</h1>
        <p data-i18n="home_desc">Design your dream space in stunning 3D. Create, explore, and visualize your ideas with ease.</p>
        
        <div class="menu-grid">
            <button class="menu-btn primary" onclick="window.location.href='editor.html'">
                <span class="btn-icon">✨</span>
                <span data-i18n="btn_new">Dự án mới</span>
            </button>
            <button class="menu-btn" onclick="window.location.href='upload.html'">
                <span class="btn-icon">📁</span>
                <span data-i18n="btn_saved">Dự án sẵn có</span>
            </button>
            <button class="menu-btn" onclick="openSettings()">
                <span class="btn-icon">⚙️</span>
                <span data-i18n="btn_settings">Cài đặt</span>
            </button>
            <button class="menu-btn" onclick="openLanguage()">
                <span class="btn-icon">🌐</span>
                <span data-i18n="btn_lang">Ngôn ngữ</span>
            </button>
        </div>
    </div>

    <!-- Settings Modal -->
    <div class="modal-overlay" id="settings-modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 data-i18n="modal_settings">⚙️ Cài đặt giao diện</h2>
                <button class="close-btn" onclick="closeSettings()">✕</button>
            </div>
            <div style="display: flex; gap: 15px; margin-top: 20px;">
                <button class="menu-btn" style="flex: 1; padding: 15px;" onclick="setTheme('light')">
                    <span style="font-size: 1.5rem;">☀️</span> <span data-i18n="btn_light">Sáng</span>
                </button>
                <button class="menu-btn" style="flex: 1; padding: 15px;" onclick="setTheme('dark')">
                    <span style="font-size: 1.5rem;">🌙</span> <span data-i18n="btn_dark">Tối</span>
                </button>
            </div>
        </div>
    </div>

    <!-- Language Modal -->
    <div class="modal-overlay" id="lang-modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 data-i18n="modal_lang">🌐 Chọn ngôn ngữ</h2>
                <button class="close-btn" onclick="closeLanguage()">✕</button>
            </div>
            <div style="display: flex; gap: 15px; margin-top: 20px;">
                <button class="menu-btn" style="flex: 1; padding: 15px;" onclick="changeLang('vi')">
                    <span style="font-size: 1.5rem;">🇻🇳</span> <span data-i18n="lang_vi">Tiếng Việt</span>
                </button>
                <button class="menu-btn" style="flex: 1; padding: 15px;" onclick="changeLang('en')">
                    <span style="font-size: 1.5rem;">🇬🇧</span> <span data-i18n="lang_en">Tiếng Anh</span>
                </button>
            </div>
        </div>
    </div>

    <script src="js/i18n.js"></script>
    <script>
        // Apply theme on load
        if (localStorage.getItem('app_theme') === 'light') {
            document.body.classList.add('light-mode');
        }

        function openSettings() {
            document.getElementById('settings-modal').classList.add('active');
        }

        function closeSettings() {
            document.getElementById('settings-modal').classList.remove('active');
        }

        function setTheme(theme) {
            if (theme === 'light') {
                document.body.classList.add('light-mode');
                localStorage.setItem('app_theme', 'light');
            } else {
                document.body.classList.remove('light-mode');
                localStorage.setItem('app_theme', 'dark');
            }
            closeSettings();
        }

        function openLanguage() {
            document.getElementById('lang-modal').classList.add('active');
        }

        function closeLanguage() {
            document.getElementById('lang-modal').classList.remove('active');
        }

        function changeLang(lang) {
            if(window.setLanguage) {
                window.setLanguage(lang);
            }
            closeLanguage();
        }

        // Đóng modal khi bấm ra ngoài
        document.getElementById('settings-modal').addEventListener('click', (e) => {
            if (e.target === document.getElementById('settings-modal')) {
                closeSettings();
            }
        });
        document.getElementById('lang-modal').addEventListener('click', (e) => {
            if (e.target === document.getElementById('lang-modal')) {
                closeLanguage();
            }
        });
    </script>
</body>
</html>
